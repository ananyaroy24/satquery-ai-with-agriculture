[build]
  base = "frontend"
  publish = "out"
  command = "npm run build"
  functions = "../netlify/functions"

# Route /api/agriculture-assessment to the Netlify function
[[redirects]]
  from = "/api/agriculture-assessment"
  to = "/.netlify/functions/agriculture-assessment"
  status = 200

# Static export fallback (Next.js generates static HTML per page)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

