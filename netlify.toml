[build]
  base = "frontend"
  publish = "out"
  command = "npm run build"
  functions = "../netlify/functions"

# Route /api/agriculture-assessment to the Netlify function
[[redirects]]
  from = "/api/agriculture-assessment"
  to = "/.netlify/functions/agriculture-assessment"
  status = 200

# SPA fallback: all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
